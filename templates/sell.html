{% extends "layout.html" %}
{% block title %}
    Sell Stocks
{% endblock %}
{% block main %}
    <div class="fade-in">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Sell Stocks</h5>
                    </div>
                    <div class="card-body">
                        <form action="/sell" method="post">
                            <div class="mb-4">
                                <label for="symbol" class="form-label">Select Stock</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-chart-line"></i></span>
                                    <select class="form-select" id="symbol" name="symbol" required>
                                        <option value="" disabled selected>Choose a stock...</option>
                                        {% for stock in stocks %}
                                            <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="shares" class="form-label">Number of Shares</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-sort-numeric-up"></i></span>
                                    <input type="number" class="form-control" id="shares" name="shares" placeholder="e.g., 5" min="1" required>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-hand-holding-usd me-2"></i> Sell Shares
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="/" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-left me-2"></i> Back to Portfolio
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
